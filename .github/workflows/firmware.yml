name: firmware

on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]

jobs:
  host:
    name: Host build, unit tests, SIL smoke test, layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Layer rules
        run: python3 firmware/tools/check_layers.py
      - name: Configure
        working-directory: firmware
        run: cmake --preset host
      - name: Build
        working-directory: firmware
        run: cmake --build --preset host
      - name: Test
        working-directory: firmware
        run: ctest --preset host

  stm32f412:
    name: Cross build (NUCLEO-F412ZG)
    runs-on: ubuntu-latest
    # Allowed to fail until the one-time CubeMX regeneration (TIM6 time base, FreeRTOS
    # handlers) is committed - see firmware/port/stm32f412/cubemx/README.md. Remove
    # continue-on-error when roadmap milestone M0 is closed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Configure
        working-directory: firmware
        run: cmake --preset f412-debug
      - name: Build
        working-directory: firmware
        run: cmake --build --preset f412-debug
      - uses: actions/upload-artifact@v4
        with:
          name: nereid_ecu-f412-debug
          path: |
            firmware/build/f412-debug/nereid_ecu.elf
            firmware/build/f412-debug/nereid_ecu.hex
            firmware/build/f412-debug/nereid_ecu.map
